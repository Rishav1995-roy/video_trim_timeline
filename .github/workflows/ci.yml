name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 04:00 UTC (09:30 IST): catch breakage from new Flutter/Dart releases.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test (Flutter ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '3.27.4'
            version: '3.27.4'
          - label: stable
            version: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ matrix.version }}
          channel: stable
          cache: true
      # The minimum-Flutter leg verifies the published PACKAGE only. example/ is a demo app that
      # tracks latest dependencies (needs a newer Dart than the package supports), so it is
      # analyzed and built on stable in its own job.
      - if: matrix.label == '3.27.4'
        run: |
          rm -rf example
          # Demo/smoke tests that import example/ code cannot run without it.
          grep -rl --include='*.dart' -E '\.\./example/' lib test tool 2>/dev/null | xargs -r rm -v || true
      - run: flutter pub get
      - if: matrix.label == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

  build-example-web:
    name: Build example (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - working-directory: example
        run: |
          flutter pub get
          flutter build web

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
